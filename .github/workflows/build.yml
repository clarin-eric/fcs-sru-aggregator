name: Build (npm + maven) + Report

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Use Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: npm
        cache-dependency-path: aggregator-webui/package-lock.json

    - name: Update npm dependencies
      run: |
        cd aggregator-webui
        npm install

    - name: Build jsx
      run: |
        cd aggregator-webui
        npm run build

    - uses: actions/upload-artifact@v7
      with:
        name: frontend-artifact
        path: aggregator-webui/dist

  build-backend:
    needs: build-frontend

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Java 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: temurin
        cache: maven

    - name: Fetch frontend build result
      uses: actions/download-artifact@v8
      with:
        name: frontend-artifact
        path: aggregator-webui/dist

    - name: Prepare build environment
      run: |
        mvn -B dependency:resolve-plugins
        mvn -B -pl .,aggregator-core dependency:resolve

    - name: Copy aggregator-webui build artifacts for embedding
      run: |
        rm -r aggregator-app/src/main/resources/assets/webapp
        mkdir aggregator-app/src/main/resources/assets/webapp
        cp -R aggregator-webui/dist/lib/. aggregator-app/src/main/resources/assets/webapp/

    - name: Build aggregator-core + aggregator-app
      run: mvn -B -pl aggregator-core,aggregator-app clean package

    - name: Prepare build artifact for packaging
      run: |
        mkdir -p staging/target
        cp aggregator-app/aggregator.yml staging/
        cp aggregator-app/target/aggregator-app-*.jar staging/target/

    - uses: actions/upload-artifact@v7
      with:
        name: Package
        path: staging

  mvn-site-report:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v7

    - name: Use Java 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Generate report
      run: |
        mvn -ntp clean site
        mv target/site report

    - uses: actions/upload-artifact@v7
      with:
        name: Report
        path: report
